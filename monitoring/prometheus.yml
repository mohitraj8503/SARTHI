### Monitoring & Observability

**Grafana + Prometheus Stack:**
```yaml
# docker-compose.monitoring.yml
version: '3.8'
services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:latest
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
```

**Application Metrics Collection:**
```typescript
// lib/metrics/application-metrics.ts
const promClient = require('prom-client');

export class ApplicationMetrics {
  private register: any;
  private metrics: any;

  constructor() {
    this.register = new promClient.Registry();

    // Enable default metrics
    promClient.collectDefaultMetrics({ register: this.register });

    this.initializeMetrics();
  }

  private initializeMetrics() {
    // HTTP request metrics
    this.metrics.httpRequestDuration = new promClient.Histogram({
      name: 'http_request_duration_seconds',
      help: 'Duration of HTTP requests in seconds',
      labelNames: ['method', 'route', 'status_code'],
      buckets: [0.1, 0.5, 1, 2, 5, 10]
    });

    // WebSocket connections
    this.metrics.websocketConnections = new promClient.Gauge({
      name: 'websocket_active_connections',
      help: 'Number of active WebSocket connections'
    });

    // LiveKit room metrics
    this.metrics.activeRooms = new promClient.Gauge({
      name: 'livekit_active_rooms',
      help: 'Number of active LiveKit rooms'
    });

    this.metrics.roomParticipants = new promClient.Gauge({
      name: 'livekit_room_participants',
      help: 'Number of participants per room',
      labelNames: ['room_name']
    });

    // Database metrics
    this.metrics.dbQueryDuration = new promClient.Histogram({
      name: 'db_query_duration_seconds',
      help: 'Duration of database queries',
      labelNames: ['query_type'],
      buckets: [0.01, 0.05, 0.1, 0.5, 1, 5]
    });

    // Memory usage
    this.metrics.memoryUsage = new promClient.Gauge({
      name: 'nodejs_memory_usage_bytes',
      help: 'Node.js memory usage',
      labelNames: ['type']
    });

    // Error rate
    this.metrics.errorRate = new promClient.Counter({
      name: 'application_errors_total',
      help: 'Total number of application errors',
      labelNames: ['type', 'component']
    });

    // Register all metrics
    this.register.registerMetric(this.metrics.httpRequestDuration);
    this.register.registerMetric(this.metrics.websocketConnections);
    // ... register all metrics
  }

  // Middleware for HTTP metrics
  getHttpMetricsMiddleware() {
    return (req: any, res: any, next: any) => {
      const start = Date.now();

      res.on('finish', () => {
        const duration = (Date.now() - start) / 1000;
        this.metrics.httpRequestDuration
          .labels(req.method, req.route?.path || req.path, res.statusCode)
          .observe(duration);
      });

      next();
    };
  }

  // Update gauge metrics
  updateWebSocketConnections(count: number) {
    this.metrics.websocketConnections.set(count);
  }

  updateActiveRooms(count: number) {
    this.metrics.activeRooms.set(count);
  }

  updateRoomParticipants(roomName: string, count: number) {
    this.metrics.roomParticipants.labels(roomName).set(count);
  }

  // Record database query metrics
  recordDbQuery(queryType: string, duration: number) {
    this.metrics.dbQueryDuration.labels(queryType).observe(duration);
  }

  // Record memory usage
  recordMemoryUsage() {
    const memUsage = process.memoryUsage();
    this.metrics.memoryUsage.labels('rss').set(memUsage.rss);
    this.metrics.memoryUsage.labels('heap_used').set(memUsage.heapUsed);
    this.metrics.memoryUsage.labels('heap_total').set(memUsage.heapTotal);
    this.metrics.memoryUsage.labels('external').set(memUsage.external);
  }

  // Record errors
  recordError(type: string, component: string) {
    this.metrics.errorRate.labels(type, component).inc();
  }

  // Get metrics for Prometheus
  async getMetrics() {
    return this.register.metrics();
  }

  // Register with Prometheus registry
  getRegister() {
    return this.register;
  }
}
```

