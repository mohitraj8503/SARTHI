**Prometheus Alerting Rules:**
```yaml
# monitoring/prometheus/rules.yml
groups:
- name: techtomorrow
  rules:

  # Critical alerts - immediate response required
  - alert: HighErrorRate
    expr: rate(application_errors_total[5m]) > 0.1
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "High error rate detected"
      description: "Error rate is {{ $value }} errors per second"

  - alert: ServiceDown
    expr: up == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Service {{ $labels.job }} is down"
      description: "{{ $labels.job }} has been down for more than 1 minute"

  # Memory alerts
  - alert: HighMemoryUsage
    expr: nodejs_memory_usage_bytes{type="heap_used"} / nodejs_memory_usage_bytes{type="heap_total"} > 0.9
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High memory usage"
      description: "Memory usage is at {{ $value | humanizePercentage }}"

  # WebSocket alerts
  - alert: WebSocketConnectionSpike
    expr: increase(websocket_active_connections[5m]) > 100
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "WebSocket connection spike"
      description: "WebSocket connections increased by {{ $value }} in 5 minutes"

  # Database alerts
  - alert: SlowDatabaseQueries
    expr: histogram_quantile(0.95, rate(db_query_duration_seconds_bucket[5m])) > 2
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Slow database queries detected"
      description: "95th percentile query time is {{ $value }}s"

  # LiveKit alerts
  - alert: RoomCapacityExceeded
    expr: livekit_room_participants > 45
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "Room at capacity"
      description: "Room {{ $labels.room_name }} has {{ $value }} participants"

  - alert: TooManyActiveRooms
    expr: livekit_active_rooms > 20
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High number of active rooms"
      description: "{{ $value }} rooms are currently active"
